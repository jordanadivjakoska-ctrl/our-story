<!DOCTYPE html>
<html lang="mk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Come to me ♡</title>

    <link rel="stylesheet" href="videa.css">
</head>

<body>

<div class="game">

    <!-- NASLOV -->

    <div class="game-title">
        <h1>Come to me ♡</h1>
        <p>→ move &nbsp;&nbsp;&nbsp; ↑ jump</p>
    </div>


    <!-- TEREN -->

    <div class="ground"></div>


    <!-- JAS -->

    <div class="character me" id="player">

        <div class="head">
            <img src="images/jas.PNG" alt="Me">
        </div>

        <div class="body"></div>

        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>

        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>

    </div>


    <!-- PRECKI -->

    <div class="obstacle obstacle1"></div>

    <div class="obstacle obstacle2"></div>

    <div class="obstacle obstacle3"></div>


    <!-- RATKO -->

    <div class="character him" id="ratko">

        <div class="head">
            <img src="images/ratko.jpeg" alt="Ratko">
        </div>

        <div class="body"></div>

        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>

        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>

    </div>


    <!-- SRCA ZA KRAJ -->

    <div class="hearts" id="hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>


    <!-- FINALNA PORAKA -->

    <div class="win-message" id="winMessage">
        <h2>Finally. ♡</h2>
        <p>Секогаш би го нашла патот до тебе.</p>
    </div>

</div>


<script src="videa.js"></script>

</body>
</html>
